    <path d="M168 122 C194 98 230 90 260 92 C228 98 202 110 186 128 C180 134 164 132 168 122 Z" fill="#57659E" opacity="0.9"/>
    <path d="M304 94 C322 98 338 108 350 120 C340 116 326 112 312 112 C304 110 300 96 304 94 Z" fill="#485480" opacity="0.85"/>
