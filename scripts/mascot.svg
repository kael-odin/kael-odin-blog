    <path d="M216 100 C200 112 190 128 186 146" stroke="#161C2D" stroke-width="4" fill="none" opacity="0.5" stroke-linecap="round"/>
    <path d="M300 102 C314 112 324 128 328 146" stroke="#161C2D" stroke-width="4" fill="none" opacity="0.5" stroke-linecap="round"/>
    <!-- soft fringe underline -->
    <path d="M156 224 C166 238 178 244 190 246 M190 206 C200 224 214 234 230 236 M234 194 C246 210 262 218 278 218 M288 182 C296 198 308 206 324 208 M338 176 C346 190 356 198 368 202" stroke="#161C2D" stroke-width="5" fill="none" opacity="0.45" stroke-linecap="round"/>
  </g>

  <!-- sprout -->
  <path d="M258 76 C257 60 262 48 274 38" stroke="#5C9A57" stroke-width="8" fill="none" stroke-linecap="round"/>
  <path d="M274 38 C258 30 244 33 236 44 C252 52 266 49 274 38 Z" fill="url(#leafA)"/>
  <path d="M274 38 C288 24 306 24 317 36 C303 48 285 47 274 38 Z" fill="url(#leafB)"/>
  <path d="M274 38 C270 33 268 28 269 22" stroke="#4E8A4C" stroke-width="3" fill="none" opacity="0.7" stroke-linecap="round"/>

  <!-- eyebrows -->
  <path d="M174 262 C186 254 202 254 214 260" stroke="#2A3350" stroke-width="9" fill="none" stroke-linecap="round"/>
  <path d="M298 260 C310 254 326 254 338 262" stroke="#2A3350" stroke-width="9" fill="none" stroke-linecap="round"/>

  <!-- eyes -->
  <g>
    <ellipse cx="194" cy="296" rx="25" ry="31" fill="#1D2540"/>
    <circle cx="195" cy="298" r="17" fill="url(#iris)"/>
    <circle cx="195" cy="301" r="8" fill="#152042"/>
    <circle cx="201" cy="290" r="5.5" fill="#FFFFFF"/>
    <circle cx="189" cy="308" r="2.5" fill="#AFCFFF" opacity="0.85"/>
  </g>
  <g>
    <ellipse cx="318" cy="296" rx="25" ry="31" fill="#1D2540"/>
    <circle cx="317" cy="298" r="17" fill="url(#iris)"/>
    <circle cx="317" cy="301" r="8" fill="#152042"/>
    <circle cx="323" cy="290" r="5.5" fill="#FFFFFF"/>
    <circle cx="311" cy="308" r="2.5" fill="#AFCFFF" opacity="0.85"/>
  </g>

  <!-- nose + mouth -->
  <path d="M253 322 C255 324 257 324 259 322" stroke="#E8B48A" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M240 340 C248 350 264 350 272 340 C268 354 244 354 240 340 Z" fill="#B3573F"/>
  <path d="M246 346 C252 352 260 352 266 346 C262 351 250 351 246 346 Z" fill="#E58868"/>
</svg>
